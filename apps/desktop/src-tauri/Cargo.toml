[package]
name = "pluralhome"
description = "PluralHome"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "pluralhome_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
specta = { version = "=2.0.0-rc.26", features = ["derive", "uuid"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
ph-core = { path = "../../../crates/ph-core", features = ["specta"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
zeroize = "1.9.1"
uuid = { version = "1.29.2", features = ["serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
ph-remote = { path = "../../../crates/ph-remote", features = ["specta"] }

[dev-dependencies]
specta-typescript = "=0.0.13"
