[package]
name = "ph-remote"
description = "Services distants de PluralHome : compte Aragonite et synchro PluralKit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
ph-core = { path = "../ph-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "form", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing", "formatting", "serde"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["serde", "v7"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
time = "0.3.55"
